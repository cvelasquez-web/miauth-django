<!doctype html> 

<html lang="es"> 

<head> 
   <meta charset="utf-8"> 
   <meta name="viewport" content="width=device-width, initial-scale=1"> 
   <title>Clientes</title> 
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head> 

<body> 

   <nav class="navbar navbar-expand-md navbar-light bg-white border-bottom"> 
       <div class="container"> 
           <a class="navbar-brand" href="{% url 'home' %}">Inicio</a> 

           <ul class="navbar-nav ms-auto d-flex flex-row align-items-center"> 
               {% if user.is_authenticated %} 
               
                   <!-- Nombre del usuario -->
                   <li class="nav-item me-3"> 
                       <span class="navbar-text">{{ user.username }}</span> 
                   </li> 

                   <!-- Enlace a Clientes CORREGIDO -->
                   <li class="nav-item me-3">
                       <a class="nav-link" href="{% url 'clientes_crear' %}">Clientes</a>
                   </li>

                   <!-- Botón de Salir CORREGIDO (con ?next=) -->
                   <li class="nav-item"> 
                       <form method="post" action="{% url 'logout' %}?next={% url 'login' %}" class="m-0"> 
                           {% csrf_token %} 
                           <button class="nav-link btn btn-link p-0" type="submit">Salir</button> 
                       </form> 
                   </li> 

               {% else %} 

                   <li class="nav-item me-3"><a class="nav-link" href="{% url 'login' %}">Entrar</a></li> 
                   <li class="nav-item"><a class="nav-link" href="{% url 'registro' %}">Registro</a></li> 

               {% endif %} 
           </ul> 
       </div> 
   </nav> 

   <main class="py-4"> 
       {% block content %}{% endblock %} 
   </main> 

</body> 

</html>
